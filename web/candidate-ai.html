<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AR · 候选人对话 AI</title><link rel="stylesheet" href="/candidate-ai.css"><script src="/candidate-ai.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">AR</span><span>人才与机会</span></a><a class="back" href="/">← 返回工作台</a></header><main><div class="intro"><span class="eyebrow">CANDIDATE CONVERSATION / AI SETTINGS</span><h1>候选人对话 AI<span>.</span></h1><p>为候选人填写资料的对话流程单独配置模型与引导规则。</p></div><div class="grid"><section class="card"><div class="card-head"><span class="number">01</span><div><h2>连接模型</h2><p>这套连接只用于候选人对话。</p></div></div><form id="configForm"><label for="baseUrl">API 基础地址</label><input id="baseUrl" type="url" placeholder="https://服务域名/v1" spellcheck="false"><label for="apiKey">API Key <small id="keyState"></small></label><div class="key-row"><input id="apiKey" type="password" placeholder="填写新密钥以保存或替换" autocomplete="new-password"><button id="toggleKey" type="button">显示</button></div><label class="checkbox"><input id="clearKey" type="checkbox">清除已保存的密钥</label><div class="model-head"><label for="model">模型</label><button id="fetchModels" type="button">获取模型列表 ↗</button></div><select id="model"><option value="">请选择模型</option></select><label for="manualModel">或手动填写模型 ID</label><input id="manualModel" type="text" placeholder="模型 ID" maxlength="200"><button class="primary" type="submit">保存设置</button><button id="testConnection" class="test-button" type="button">保存并测试对话</button></form></section><section class="card prompt-card"><div class="card-head"><span class="number">02</span><div><h2>对话提示词</h2><p>告诉 AI 如何询问、提取和确认候选人资料。</p></div></div><label for="prompt">引导规则</label><textarea id="prompt" form="configForm" maxlength="16000" spellcheck="false"></textarea><p class="hint">候选人提交的字段会按飞书表格当前结构校验；简历仍需在候选人端上传。</p></section></div><p id="status" class="status" role="status"></p><section id="testResult" class="test-result" hidden><h2>测试结果</h2><p id="testMeta"></p><div id="testReply"></div></section></main></body></html>
